name: Check Proxy Configs

on:
  schedule:
    # Every 6 hours. Public repos get unlimited Actions minutes, so
    # the real constraint is politeness to source sites + job runtime,
    # not your quota. Tighten to */3 or */4 if node churn justifies it.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit working.txt back

concurrency:
  group: proxy-check
  cancel-in-progress: true   # don't let overlapping runs step on each other

jobs:
  test-nodes:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Xray-core
        env:
          # Pinned deliberately -- XTLS ships releases very frequently,
          # so tracking "latest" means the binary (and potentially its
          # config schema) can change under you with no warning between
          # runs. Bump this intentionally when you want to upgrade, and
          # re-run the workflow manually once to confirm nothing broke.
          XRAY_VERSION: v26.7.28
        run: |
          curl -fsSL -o xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -o xray.zip -d xray_bin
          sudo mv xray_bin/xray /usr/local/bin/xray
          sudo chmod +x /usr/local/bin/xray
          xray version

      - name: Run tester
        working-directory: scripts
        run: python main.py

      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add working.txt working_base64.txt
          git diff --cached --quiet || git commit -m "Update working configs [skip ci]"
          git push
